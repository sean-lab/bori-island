name: Release

# Publishes bori-island-<tag>.tar.gz (index.html at its root) on the GitHub release for a v* tag.
# sanghyunpark.dev pins a version and serves it at /apps/bori-island/.
#
# Two ways to start it:
#   - push a tag such as v1.0.0 (the release is created here), or
#   - publish a release on GitHub (the archive is attached to it).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Package
        run: tar -czf "bori-island-${GITHUB_REF_NAME}.tar.gz" -C dist index.html

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="bori-island-${GITHUB_REF_NAME}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes
          fi
