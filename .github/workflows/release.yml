name: Release

# Pushing a tag such as v1.0.0 publishes bori-island-v1.0.0.tar.gz (index.html at its root)
# to a GitHub release. sanghyunpark.dev pins a version and serves it at /apps/bori-island/.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Package
        run: tar -czf "bori-island-${GITHUB_REF_NAME}.tar.gz" -C dist index.html

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "bori-island-${GITHUB_REF_NAME}.tar.gz"
          --title "$GITHUB_REF_NAME" --generate-notes
